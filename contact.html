<body>
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="hero small-hero" style="background-image: url('images/contact-main.png');">
    <div class="hero-text">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you. Let's plan your perfect escape!</p>
    </div>
  </section>

  <!-- Contact Info & Form -->
  <section class="contact-section">
    <div class="contact-info">
      <h2> Call Us 📞</h2>
      <ul>
        <li><a href="tel:+917558640623">7558640623</a></li>
        <li><a href="tel:+918530760323">8530760323</a></li>
        <li><a href="tel:+919011354222">9011354222</a></li>
        
      </ul>
      <h2> Email 📧</h2>
      <p><a href="mailto:campingsthan@gmail.com">campingsthan@gmail.com</a></p>
    </div>

    <div class="contact-form-section">
      <h2>📬 Send Us a Message</h2>
      <form>
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" placeholder="Email" required>

        <label for="message">Your Message</label>
        <textarea id="message" rows="5" placeholder="Type your message here..." required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </section>

  <div id="footer-placeholder"></div>
